<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إلى شروق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15100b;
    --bg-deep:#0d0a07;
    --paper:#ecdfc2;
    --paper-shadow:#c9b483;
    --ink:#2b2013;
    --ink-soft:#4a3b26;
    --brass:#a9814c;
    --brass-light:#d3ac6e;
    --ember:#a85338;
    --rain:#26323b;
    --glow: rgba(201,150,85,0.16);
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    overflow:hidden;
    font-family:'Amiri', 'Times New Roman', serif;
    color:var(--ink);
  }

  #stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
  }

  /* ---------- ambient texture layers ---------- */

  #grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:40;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%);
  }

  #dust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    overflow:hidden;
  }
  .mote{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--brass-light);
    opacity:0;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ opacity:0; transform:translateY(0) translateX(0); }
    10%{ opacity:0.5; }
    90%{ opacity:0.35; }
    100%{ opacity:0; transform:translateY(-120px) translateX(20px); }
  }

  /* ---------- scenes ---------- */

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transform:scale(1);
    transition:opacity 1.5s ease, transform 1.8s ease;
  }
  .scene.active{
    opacity:1;
    pointer-events:auto;
  }
  .scene.leaving{
    opacity:0;
    transform:scale(1.12);
    transition:opacity 1.3s ease, transform 1.9s ease;
  }
  .scene.entering{
    transition:opacity 1.6s ease 0.5s, transform 2.2s ease 0.2s;
  }

  .desk{
    position:absolute;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, var(--glow), transparent 70%),
      repeating-linear-gradient(100deg, #1c140d 0px, #1c140d 2px, #17110b 3px, #17110b 40px),
      linear-gradient(180deg, #100c08 0%, #0b0805 100%);
  }

  /* ---------- letter ---------- */

  .letter{
    position:relative;
    z-index:5;
    width:clamp(280px, 82vw, 460px);
    padding:clamp(28px,6vw,48px) clamp(26px,6vw,42px) 34px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.10), transparent 55%),
      var(--paper);
    color:var(--ink);
    text-align:center;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.15) inset,
      0 30px 60px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.06);
    clip-path:polygon(0.6% 1.2%, 99% 0%, 100% 98.4%, 0.3% 100%);
    transform:rotate(-1.1deg);
    transition:transform 1.6s cubic-bezier(.5,0,.2,1), opacity 1.4s ease, filter 1.6s ease;
  }
  .letter::before{
    content:"";
    position:absolute;
    pointer-events:none;
    inset:0;
    opacity:0.5;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.02' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }
  .letter.opening{
    transform:rotate(0deg) scale(1.08) translateY(-14px);
    opacity:0;
    filter:blur(1px);
  }

  .letter .to{
    font-family:'Rakkas','Amiri',serif;
    font-size:clamp(24px,5.2vw,31px);
    font-weight:400;
    letter-spacing:0;
    line-height:1.25;
    margin:0 0 22px;
    text-shadow:0.3px 0 var(--ink);
  }
  .letter .body{
    font-family:'Amiri',serif;
    font-size:clamp(17px,3.9vw,20px);
    font-weight:400;
    line-height:2.05;
    color:var(--ink-soft);
    letter-spacing:0.1px;
    margin:0 0 30px;
  }
  .letter .hint{
    font-family:'Katibeh','Amiri',serif;
    font-size:clamp(18px,4.2vw,22px);
    color:var(--ember);
    opacity:0.9;
    line-height:1.4;
    margin:0 0 26px;
  }

  .ink-btn{
    appearance:none;
    position:relative;
    z-index:20;
    pointer-events:auto;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Amiri', serif;
    font-size:17px;
    font-weight:400;
    padding:9px 30px;
    letter-spacing:0.5px;
    cursor:pointer;
    border-radius:2px;
    transition:background 0.4s ease, color 0.4s ease, letter-spacing 0.4s ease;
  }
  .ink-btn:hover{
    background:var(--ink);
    color:var(--paper);
    letter-spacing:1.5px;
  }
  .ink-btn:focus-visible{
    outline:2px solid var(--brass-light);
    outline-offset:3px;
  }

  /* ---------- gramophone scene ---------- */
  #scene-gramophone{
    isolation:isolate;
    background:
      radial-gradient(circle at 50% 43%, rgba(198,153,86,.08), transparent 28%),
      radial-gradient(circle at 50% 80%, rgba(168,83,56,.06), transparent 35%);
  }

  #scene-gramophone .window{
    display:none !important;
  }

  .gramophone-wrap{
    position:relative;
    z-index:5;
    width:clamp(245px,62vw,330px);
    aspect-ratio:1;
    display:flex;
    justify-content:center;
    filter:
      drop-shadow(0 22px 28px rgba(0,0,0,.65))
      drop-shadow(0 0 18px rgba(201,150,85,.08));
    transform:translateY(-1vh);
  }

  .gramophone-wrap::before{
    content:"";
    position:absolute;
    width:72%;
    height:18%;
    left:14%;
    bottom:7%;
    border-radius:50%;
    background:rgba(0,0,0,.42);
    filter:blur(14px);
    z-index:-1;
    transition:opacity 1s ease, transform 1s ease;
  }

  .gramophone-wrap.active::before{
    opacity:.8;
    transform:scale(1.06);
  }

  .tonearm{
    transform-origin:238px 150px;
    transform:rotate(-26deg);
    transition:transform 1.5s cubic-bezier(.4,0,.2,1);
  }

  .gramophone-wrap.active .tonearm{
    transform:rotate(0deg);
  }

  .gramophone-wrap.ended .tonearm{
    transform:rotate(-26deg);
    transition:transform 2.2s ease;
  }

  .vinyl-group{
    transform-origin:150px 150px;
    animation:spin 3.8s linear infinite;
    animation-play-state:paused;
  }

  .gramophone-wrap.spinning .vinyl-group{
    animation-play-state:running;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .horn-glow{
    opacity:.28;
    transform-origin:258px 100px;
    transition:opacity 1s ease, filter 1s ease, transform 1s ease;
  }

  .gramophone-wrap.active .horn-glow{
    opacity:.95;
    filter:drop-shadow(0 0 13px rgba(211,172,110,.25));
    animation:hornPulse 2.8s ease-in-out infinite;
  }

  @keyframes hornPulse{
    0%,100%{ transform:scale(1); opacity:.72; }
    50%{ transform:scale(1.018); opacity:1; }
  }

  /* Tiny engraved shine that travels across the record while it spins. */
  .vinyl-group::after{
    content:"";
  }

  .song-info{
    position:relative;
    z-index:5;
    width:min(92vw,430px);
    text-align:center;
    margin-top:4px;
    padding:0 18px;
  }

  .song-info .label{
    font-family:'Katibeh','Amiri',serif;
    font-size:clamp(15px,3.4vw,18px);
    color:var(--brass-light);
    opacity:.82;
    margin:0 0 2px;
    letter-spacing:.2px;
  }

  .song-info .title{
    font-family:'Rakkas','Amiri',serif;
    font-size:clamp(23px,5vw,30px);
    font-weight:400;
    line-height:1.3;
    color:var(--paper);
    margin:0 0 1px;
    text-shadow:0 1px 12px rgba(211,172,110,.08);
  }

  .song-info .artist{
    font-family:'Amiri',serif;
    font-size:clamp(14px,3.4vw,16px);
    color:var(--paper-shadow);
    opacity:.7;
    margin:0 0 15px;
  }

  #play-btn{
    position:relative;
    min-width:118px;
    border-color:rgba(211,172,110,.7) !important;
    color:var(--paper) !important;
    background:rgba(18,12,7,.2);
    backdrop-filter:blur(4px);
    box-shadow:0 8px 22px rgba(0,0,0,.2);
    transition:transform .3s ease, background .3s ease, box-shadow .3s ease, opacity .5s ease;
  }

  #play-btn:hover{
    transform:translateY(-2px);
    background:rgba(168,129,76,.12);
    box-shadow:0 10px 28px rgba(0,0,0,.35);
  }

  #play-btn:active{
    transform:translateY(0) scale(.98);
  }

  .gramophone-wrap.spinning + .song-info #play-btn{
    box-shadow:
      0 0 0 1px rgba(211,172,110,.08),
      0 0 22px rgba(201,150,85,.08);
  }

  .note{
    position:relative;
    z-index:5;
    max-width:390px;
    margin:15px auto 0;
    text-align:center;
    font-family:'Katibeh','Amiri',serif;
    color:var(--paper-shadow);
    opacity:0;
    transform:translateY(8px);
    transition:opacity 1.2s ease, transform 1.2s ease;
    padding:0 20px;
  }

  .note.shown{
    opacity:.86;
    transform:translateY(0);
  }

  .note p{
    font-size:clamp(16px,3.7vw,18px);
    line-height:1.7;
    margin:0 0 5px;
  }

  .note .wish{
    font-family:'Amiri',serif;
    font-size:clamp(12px,3.1vw,14px);
    opacity:.65;
  }

  /* Subtle music glow behind the player, only when the record is actually playing. */
  #scene-gramophone::after{
    content:"";
    position:absolute;
    width:min(75vw,390px);
    height:min(75vw,390px);
    border-radius:50%;
    left:50%;
    top:39%;
    transform:translate(-50%,-50%) scale(.75);
    background:radial-gradient(circle, rgba(201,150,85,.08), transparent 63%);
    filter:blur(8px);
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s ease, transform 2s ease;
    z-index:1;
  }

  #scene-gramophone:has(.gramophone-wrap.spinning)::after{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:musicAura 3.5s ease-in-out infinite;
  }

  @keyframes musicAura{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }

  #ending{
    position:absolute;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    opacity:0;
    transition:opacity 2s ease;
    z-index:5;
    pointer-events:none;
    width:min(90vw,420px);
  }

  #ending.shown{ opacity:.9; }

  #ending p{
    font-family:'Katibeh','Amiri',serif;
    font-size:clamp(15px,3.6vw,18px);
    color:var(--paper-shadow);
    margin:0;
    line-height:1.7;
  }

  #ending .sig{
    margin-top:6px;
    font-family:'Amiri',serif;
    font-size:clamp(14px,3.4vw,16px);
    color:var(--brass-light);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="dust"></div>

  <main id="stage">

    <section id="scene-letter" class="scene active">
      <div class="desk"></div>
      <div class="letter" id="letter">
        <p class="to">إلى شروق</p>
        <p class="body">فتحتِ الجواب… لكني تركت بداخله شيئًا آخر.</p>
        <p class="hint">هناك أغنية صغيرة تنتظركِ.</p>
        <button type="button" class="ink-btn" id="open-btn">افتحيها</button>
      </div>
    </section>

    <section id="scene-gramophone" class="scene">
      <div class="desk"></div>
      <div class="window" id="window"></div>

      <div class="gramophone-wrap" id="gramophone">
        <svg viewBox="0 0 300 300" width="100%" height="100%">
          <defs>
            <radialGradient id="hornGrad" cx="30%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#e7c383"/>
              <stop offset="55%" stop-color="#a9814c"/>
              <stop offset="100%" stop-color="#6e5230"/>
            </radialGradient>
            <radialGradient id="discGrad" cx="50%" cy="50%" r="55%">
              <stop offset="0%" stop-color="#2a2a2a"/>
              <stop offset="85%" stop-color="#151515"/>
              <stop offset="100%" stop-color="#050505"/>
            </radialGradient>
            <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a2a19"/>
              <stop offset="100%" stop-color="#1e150c"/>
            </linearGradient>
          </defs>

          <!-- horn -->
          <g class="horn-glow">
            <path d="M235,150 C275,110 288,55 258,20 C300,45 300,105 250,150 Z" fill="url(#hornGrad)"/>
            <path d="M235,150 C275,110 288,55 258,20" fill="none" stroke="#5c431f" stroke-width="2" opacity="0.5"/>
          </g>

          <!-- base -->
          <rect x="60" y="185" width="180" height="18" rx="4" fill="url(#baseGrad)"/>
          <rect x="60" y="185" width="180" height="4" rx="2" fill="#4a3520" opacity="0.6"/>

          <!-- turntable plinth -->
          <ellipse cx="150" cy="182" rx="95" ry="14" fill="#241a10"/>

          <!-- spinning disc -->
          <g class="vinyl-group">
            <circle cx="150" cy="150" r="78" fill="url(#discGrad)"/>
            <circle cx="150" cy="150" r="66" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
            <circle cx="150" cy="150" r="54" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
            <circle cx="150" cy="150" r="42" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
            <circle cx="150" cy="150" r="16" fill="#a9814c"/>
            <circle cx="150" cy="150" r="4" fill="#1a1206"/>
          </g>

          <!-- tonearm -->
          <g class="tonearm">
            <circle cx="238" cy="150" r="7" fill="#7a5b34"/>
            <rect x="150" y="147" width="88" height="5" rx="2.5" fill="#c9a262"/>
            <circle cx="150" cy="150" r="4" fill="#3a2a19"/>
          </g>
        </svg>
      </div>

      <div class="song-info">
        <p class="label">الأغنية التي تركتها لكِ</p>
        <p class="title" id="song-title"></p>
        <p class="artist" id="song-artist"></p>
        <button type="button" class="ink-btn" id="play-btn" style="border-color:var(--paper-shadow); color:var(--paper);">اسمعيها</button>
      </div>

      <div class="note" id="note">
        <p>يمكن بعض الكلام ما بيتقالش بسهولة...<br>فقلت أسيبه في أغنية.</p>
        <p class="wish">أتمنى تسمعيها وأنتِ مبسوطة.</p>
      </div>

      <div id="ending">
        <p id="ending-line"></p>
        <p class="sig" id="signature"></p>
      </div>
    </section>

  </main>

  <audio id="audio" src="Daq-El-Hawa-Ala-El-Bab.mp3" preload="none"></audio>

  <script>
    // ---- easily editable content ----
    const CONFIG = {
      songTitle: "دقّ الهوى ع الباب",
      artist: "فيروز",
      endingLine: "دلوقتي فهمتِ ليه كانت الأغنية جوّا الجواب.",
      signature: "— يوسف"
    };

    document.getElementById('song-title').textContent = CONFIG.songTitle;
    document.getElementById('song-artist').textContent = CONFIG.artist;
    document.getElementById('ending-line').textContent = CONFIG.endingLine;
    document.getElementById('signature').textContent = CONFIG.signature;

    // ---- dust particles ----
    const dustEl = document.getElementById('dust');
    for(let i=0;i<16;i++){
      const m = document.createElement('div');
      m.className = 'mote';
      m.style.left = Math.random()*100+'%';
      m.style.top = 40+Math.random()*50+'%';
      m.style.animationDuration = (8+Math.random()*10)+'s';
      m.style.animationDelay = (Math.random()*8)+'s';
      dustEl.appendChild(m);
    }

    // ---- letter opening ----
    const letter = document.getElementById('letter');
    const sceneLetter = document.getElementById('scene-letter');
    const sceneGramophone = document.getElementById('scene-gramophone');

    // ---- gramophone / audio ----
    const audio = document.getElementById('audio');
    const gramophone = document.getElementById('gramophone');
    const playBtn = document.getElementById('play-btn');
    const note = document.getElementById('note');
    const ending = document.getElementById('ending');

    const openBtn = document.getElementById('open-btn');

    function openGramophone(e){
      if(e) e.preventDefault();

      // Prevent double taps from firing the transition twice.
      if(openBtn.dataset.opened === 'true') return;
      openBtn.dataset.opened = 'true';
      openBtn.disabled = true;

      letter.classList.add('opening');
      sceneLetter.classList.add('leaving');

      // The click/tap itself is the user gesture, so try to start the audio here.
      const playPromise = audio.play();
      if(playPromise !== undefined){
        playPromise.catch((error) => {
          console.warn('تعذر التشغيل التلقائي:', error);
        });
      }

      setTimeout(() => {
        sceneLetter.classList.remove('active','leaving');
        sceneGramophone.classList.add('active','entering');

        requestAnimationFrame(() => {
          sceneGramophone.classList.remove('entering');
        });
      }, 900);
    }

    openBtn.addEventListener('click', openGramophone);
    openBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      openGramophone(e);
    }, {passive:false});

    playBtn.addEventListener('click', () => {
      if(audio.paused){
        audio.play().catch((error) => {
          console.error('تعذر تشغيل ملف الأغنية:', error);
          playBtn.textContent = 'تعذر تشغيل الأغنية';
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('error', () => {
      console.error('لم يتم العثور على ملف الأغنية أو تعذر تحميله. تأكد أن الملف موجود بجانب index.html وأن اسمه Daq-El-Hawa-Ala-El-Bab.mp3');
      playBtn.textContent = 'اسمعيها';
      playBtn.disabled = false;
    });

    audio.addEventListener('play', () => {
      gramophone.classList.remove('ended');
      gramophone.classList.add('active','spinning');
      playBtn.textContent = 'وقفيها';
      note.classList.add('shown');
    });

    audio.addEventListener('pause', () => {
      gramophone.classList.remove('spinning');
      if(!audio.ended){
        playBtn.textContent = 'اسمعيها';
      }
    });

    audio.addEventListener('ended', () => {
      gramophone.classList.remove('spinning','active');
      gramophone.classList.add('ended');
      playBtn.style.opacity = '0';
      playBtn.style.pointerEvents = 'none';
      setTimeout(() => ending.classList.add('shown'), 1200);
    });
  </script>
</body>
</html>
