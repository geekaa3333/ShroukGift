<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إلى شروق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#160c16;
    --bg-deep:#0d0710;
    --paper:#f4dfeb;
    --paper-shadow:#cba8bb;
    --ink:#351d31;
    --ink-soft:#5b3a53;
    --brass:#a86b91;
    --brass-light:#e3a9c8;
    --ember:#b85b87;
    --rain:#2b1828;
    --glow:rgba(205,105,158,.18);
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    overflow:hidden;
    font-family:'Amiri', 'Times New Roman', serif;
    color:var(--ink);
  }

  #stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
  }

  /* ---------- ambient texture layers ---------- */

  #grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:40;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%);
  }

  #dust{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    overflow:hidden;
  }
  .mote{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--brass-light);
    opacity:0;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ opacity:0; transform:translateY(0) translateX(0); }
    10%{ opacity:0.5; }
    90%{ opacity:0.35; }
    100%{ opacity:0; transform:translateY(-120px) translateX(20px); }
  }

  /* ---------- scenes ---------- */

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transform:scale(1);
    transition:opacity 1.5s ease, transform 1.8s ease;
  }
  .scene.active{
    opacity:1;
    pointer-events:auto;
  }
  .scene.leaving{
    opacity:0;
    transform:scale(1.12);
    transition:opacity 1.3s ease, transform 1.9s ease;
  }
  .scene.entering{
    transition:opacity 1.6s ease 0.5s, transform 2.2s ease 0.2s;
  }

  .desk{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 34%, rgba(226,126,175,.16), transparent 30%),
      radial-gradient(circle at 18% 22%, rgba(246,190,219,.10), transparent 22%),
      radial-gradient(circle at 82% 74%, rgba(174,71,126,.12), transparent 26%),
      linear-gradient(180deg, #1a0b18 0%, #0d0610 100%);
  }

  /* ---------- letter ---------- */

  .letter{
    position:relative;
    z-index:5;
    width:clamp(280px, 82vw, 460px);
    padding:clamp(28px,6vw,48px) clamp(26px,6vw,42px) 34px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.10), transparent 55%),
      var(--paper);
    color:var(--ink);
    text-align:center;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.15) inset,
      0 30px 60px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.06);
    clip-path:polygon(0.6% 1.2%, 99% 0%, 100% 98.4%, 0.3% 100%);
    transform:rotate(-1.1deg);
    transition:transform 1.6s cubic-bezier(.5,0,.2,1), opacity 1.4s ease, filter 1.6s ease;
  }
  .letter::before{
    content:"";
    position:absolute;
    pointer-events:none;
    inset:0;
    opacity:0.5;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.02' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }
  .letter.opening{
    transform:rotate(0deg) scale(1.08) translateY(-14px);
    opacity:0;
    filter:blur(1px);
  }

  .letter .to{
    font-family:'Rakkas','Amiri',serif;
    font-size:clamp(24px,5.2vw,31px);
    font-weight:400;
    letter-spacing:0;
    line-height:1.25;
    margin:0 0 22px;
    text-shadow:0.3px 0 var(--ink);
  }
  .letter .body{
    font-family:'Amiri',serif;
    font-size:clamp(17px,3.9vw,20px);
    font-weight:400;
    line-height:2.05;
    color:var(--ink-soft);
    letter-spacing:0.1px;
    margin:0 0 30px;
  }
  .letter .hint{
    font-family:'Katibeh','Amiri',serif;
    font-size:clamp(18px,4.2vw,22px);
    color:var(--ember);
    opacity:0.9;
    line-height:1.4;
    margin:0 0 26px;
  }

  .ink-btn{
    appearance:none;
    position:relative;
    z-index:20;
    pointer-events:auto;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Amiri', serif;
    font-size:17px;
    font-weight:400;
    padding:9px 30px;
    letter-spacing:0.5px;
    cursor:pointer;
    border-radius:2px;
    transition:background 0.4s ease, color 0.4s ease, letter-spacing 0.4s ease;
  }
  .ink-btn:hover{
    background:var(--ink);
    color:var(--paper);
    letter-spacing:1.5px;
  }
  .ink-btn:focus-visible{
    outline:2px solid var(--brass-light);
    outline-offset:3px;
  }

  /* ---------- gramophone scene ---------- */
  #scene-gramophone{
    isolation:isolate;
    background:
      radial-gradient(circle at 50% 43%, rgba(198,153,86,.08), transparent 28%),
      radial-gradient(circle at 50% 80%, rgba(168,83,56,.06), transparent 35%);
  }

  #scene-gramophone .window{
    display:none !important;
  }

  .gramophone-wrap{
    position:relative;
    z-index:6;
    width:clamp(300px,68vw,430px);
    aspect-ratio:1;
    display:flex;
    justify-content:center;
    filter:
      drop-shadow(0 22px 28px rgba(0,0,0,.65))
      drop-shadow(0 0 18px rgba(201,150,85,.08));
    transform:translateY(-1vh);
  }

  .gramophone-wrap::before{
    content:"";
    position:absolute;
    width:72%;
    height:18%;
    left:14%;
    bottom:7%;
    border-radius:50%;
    background:rgba(0,0,0,.42);
    filter:blur(14px);
    z-index:-1;
    transition:opacity 1s ease, transform 1s ease;
  }

  .gramophone-wrap.active::before{
    opacity:.8;
    transform:scale(1.06);
  }

  .tonearm{
    transform-origin:238px 150px;
    transform:rotate(-26deg);
    transition:transform 1.5s cubic-bezier(.4,0,.2,1);
  }

  .gramophone-wrap.active .tonearm{
    transform:rotate(0deg);
  }

  .gramophone-wrap.ended .tonearm{
    transform:rotate(-26deg);
    transition:transform 2.2s ease;
  }


  /* ---------- realistic record loading animation ---------- */
    .vinyl-group{
    transform-origin:150px 150px;
    animation:spin 2.85s linear infinite;
    animation-play-state:paused;
    opacity:0;
    transform:translateY(-22px) scale(.72);
    transition:opacity .8s ease, transform .95s cubic-bezier(.2,.8,.2,1);
  }

  .gramophone-wrap.record-ready .vinyl-group{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .gramophone-wrap.spinning .vinyl-group{
    animation-play-state:running;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  /* Small label/accent ring makes the platter read more like a real record. */
  .gramophone-wrap.record-ready .vinyl-group circle:nth-child(4){
    filter:drop-shadow(0 0 2px rgba(227,169,200,.22));
  }

  /* Brief "needle meets record" motion after the record lands. */
  .gramophone-wrap.spinning .tonearm{
    animation:needlePulse 1.8s ease-in-out infinite;
  }

  @keyframes needlePulse{
    0%,100%{filter:drop-shadow(0 0 0 rgba(227,169,200,0))}
    50%{filter:drop-shadow(0 0 5px rgba(227,169,200,.3))}
  }

  .gramophone-wrap.spinning{
    animation:gramophoneSway 2.8s ease-in-out infinite;
  }

  #scene-gramophone:has(.gramophone-wrap.spinning)::after{
    background:radial-gradient(circle, rgba(218,111,166,.13), transparent 63%);
  }
  #play-btn{
    border-color:rgba(227,169,200,.72) !important;
    color:#f4dfeb !important;
    background:linear-gradient(180deg,rgba(184,91,135,.16),rgba(88,39,69,.14));
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  .love-particles{
    position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden;
  }
  .love-particles span{
    position:absolute; bottom:-30px; color:rgba(232,155,194,.38);
    font-family:Arial,sans-serif; font-size:clamp(10px,2vw,16px);
    animation:floatHeart linear infinite; animation-play-state:paused;
  }
  .love-particles span:nth-child(1){left:12%;animation-duration:9s;animation-delay:1s}
  .love-particles span:nth-child(2){left:27%;animation-duration:12s;animation-delay:4s}
  .love-particles span:nth-child(3){left:43%;animation-duration:10s}
  .love-particles span:nth-child(4){left:61%;animation-duration:13s;animation-delay:5s}
  .love-particles span:nth-child(5){left:78%;animation-duration:9.5s;animation-delay:2s}
  .love-particles span:nth-child(6){left:91%;animation-duration:11s;animation-delay:6s}
  @keyframes floatHeart{
    0%{transform:translateY(20px) rotate(-8deg);opacity:0}
    12%{opacity:.55}
    55%{transform:translate(12px,-48vh) rotate(8deg);opacity:.35}
    100%{transform:translate(-10px,-105vh) rotate(-5deg);opacity:0}
  }
  #scene-gramophone:has(.gramophone-wrap.spinning) .love-particles span{
    animation-play-state:running;
  }

  /* ---------- cute floating romantic background ---------- */
  .cute-bg{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }

  .cute-bg span{
    position:absolute;
    color:rgba(239,158,201,.24);
    font-family:Arial,sans-serif;
    font-size:clamp(13px,2.6vw,22px);
    text-shadow:0 0 10px rgba(229,117,173,.12);
    filter:blur(.05px);
    animation:floatCute 10s ease-in-out infinite;
  }

  .cute-bg span:nth-child(1){left:7%;top:18%;animation-delay:-2s;animation-duration:11s}
  .cute-bg span:nth-child(2){left:18%;top:70%;animation-delay:-6s;animation-duration:13s;font-size:15px}
  .cute-bg span:nth-child(3){left:30%;top:14%;animation-delay:-3s;animation-duration:9s}
  .cute-bg span:nth-child(4){left:43%;top:82%;animation-delay:-8s;animation-duration:14s}
  .cute-bg span:nth-child(5){left:55%;top:16%;animation-delay:-1s;animation-duration:12s}
  .cute-bg span:nth-child(6){left:67%;top:70%;animation-delay:-5s;animation-duration:10s;font-size:15px}
  .cute-bg span:nth-child(7){left:79%;top:23%;animation-delay:-4s;animation-duration:13s}
  .cute-bg span:nth-child(8){left:91%;top:62%;animation-delay:-7s;animation-duration:11s}
  .cute-bg span:nth-child(9){left:12%;top:46%;animation-delay:-9s;animation-duration:12s}
  .cute-bg span:nth-child(10){left:87%;top:40%;animation-delay:-2s;animation-duration:14s}
  .cute-bg span:nth-child(11){left:36%;top:48%;animation-delay:-10s;animation-duration:11s}
  .cute-bg span:nth-child(12){left:70%;top:50%;animation-delay:-6s;animation-duration:13s}

  @keyframes floatCute{
    0%,100%{transform:translate3d(0,0,0) rotate(-7deg) scale(1);opacity:.35}
    50%{transform:translate3d(12px,-16px,0) rotate(8deg) scale(1.08);opacity:.65}
  }

  /* Tiny glowing romantic specks, like fairy dust. */
  .desk::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(247,181,215,.34) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(218,128,178,.24) 0 1px, transparent 1.6px);
    background-size:78px 92px, 116px 138px;
    background-position:14px 24px, 42px 62px;
    opacity:.42;
    animation:sparkleDrift 18s linear infinite;
  }

  @keyframes sparkleDrift{
    from{background-position:14px 24px,42px 62px}
    to{background-position:72px 88px,4px 2px}
  }

  .gramophone-wrap:not(.record-ready) .vinyl-group{
    opacity:0 !important;
    transform:translateY(-22px) scale(.72);
  }

  /* ---------- gramophone text/UI: always visible ---------- */
  .song-info{
    position:relative;
    z-index:10;
    width:min(92vw,460px);
    margin-top:10px;
    padding:0 18px;
    text-align:center;
    opacity:1 !important;
    visibility:visible !important;
    transform:none !important;
  }

  .song-info .label{
    font-family:'Katibeh','Amiri',serif;
    font-size:clamp(16px,3.5vw,19px);
    line-height:1.3;
    color:#e7b4cf;
    opacity:.92;
    margin:0 0 2px;
  }

  .song-info .title{
    font-family:'Rakkas','Amiri',serif;
    font-size:clamp(24px,5.2vw,31px);
    font-weight:400;
    line-height:1.35;
    color:#f6ddea;
    text-shadow:0 1px 10px rgba(224,128,174,.18);
    margin:0 0 1px;
  }

  .song-info .artist{
    font-family:'Amiri',serif;
    font-size:clamp(14px,3.5vw,17px);
    line-height:1.5;
    color:#cfaabc;
    opacity:.9;
    margin:0 0 15px;
  }

  .note{
    position:relative;
    z-index:10;
    width:min(92vw,420px);
    margin:13px auto 0;
    padding:0 20px;
    text-align:center;
    font-family:'Katibeh','Amiri',serif;
    color:#d7b4c7;
    opacity:1 !important;
    visibility:visible !important;
    transform:none !important;
  }

  .note.shown{
    opacity:1 !important;
    transform:none !important;
  }

  .note p{
    font-size:clamp(16px,3.8vw,19px);
    line-height:1.7;
    margin:0 0 5px;
  }

  .note .wish{
    font-family:'Amiri',serif;
    font-size:clamp(12px,3.2vw,15px);
    color:#bfa0b1;
    opacity:.82;
  }

  #play-btn{
    position:relative;
    z-index:20;
    min-width:120px;
    margin-top:2px;
  }

  /* Keep the gramophone scene centered as a composition. */
  #scene-gramophone{
    gap:0;
  }

  @media (max-width:639px){
    .song-info{
      margin-top:3px;
      padding:0 10px;
    }

    .song-info .label{
      font-size:16px;
    }

    .song-info .title{
      font-size:clamp(23px,6.2vw,29px);
    }

    .song-info .artist{
      font-size:15px;
      margin-bottom:12px;
    }

    .note{
      margin-top:10px;
      padding:0 12px;
    }

    .note p{
      font-size:clamp(15px,4.1vw,18px);
      line-height:1.65;
    }
  }
</style>
</head>
<body>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="dust"></div>

  <main id="stage">

    <section id="scene-letter" class="scene active">
      <div class="desk"></div>
      <div class="letter" id="letter">
        <p class="to">إلى شروق</p>
        <p class="body">فتحتِ الجواب… لكني تركت بداخله شيئًا آخر.</p>
        <p class="hint">هناك أغنية صغيرة تنتظركِ.</p>
        <button type="button" class="ink-btn" id="open-btn">افتحيها</button>
      </div>
    </section>

    <section id="scene-gramophone" class="scene">
      <div class="desk"></div>
      <div class="cute-bg" aria-hidden="true">
        <span>♥</span><span>♡</span><span>✦</span><span>♥</span><span>♡</span>
        <span>✧</span><span>♥</span><span>♡</span><span>✦</span><span>♥</span>
        <span>♡</span><span>✧</span>
      </div>
      <div class="love-particles" aria-hidden="true">
        <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
      </div>
      <div class="window" id="window"></div>

      <div class="gramophone-wrap" id="gramophone">
        <svg viewBox="0 0 300 300" width="100%" height="100%">
          <defs>
            <radialGradient id="hornGrad" cx="30%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#e7c383"/>
              <stop offset="55%" stop-color="#a9814c"/>
              <stop offset="100%" stop-color="#6e5230"/>
            </radialGradient>
            <radialGradient id="discGrad" cx="50%" cy="50%" r="55%">
              <stop offset="0%" stop-color="#2a2a2a"/>
              <stop offset="85%" stop-color="#151515"/>
              <stop offset="100%" stop-color="#050505"/>
            </radialGradient>
            <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a2a19"/>
              <stop offset="100%" stop-color="#1e150c"/>
            </linearGradient>
          </defs>

          <!-- horn -->
          <g class="horn-glow">
            <path d="M235,150 C275,110 288,55 258,20 C300,45 300,105 250,150 Z" fill="url(#hornGrad)"/>
            <path d="M235,150 C275,110 288,55 258,20" fill="none" stroke="#5c431f" stroke-width="2" opacity="0.5"/>
          </g>

          <!-- base -->
          <rect x="60" y="185" width="180" height="18" rx="4" fill="url(#baseGrad)"/>
          <rect x="60" y="185" width="180" height="4" rx="2" fill="#4a3520" opacity="0.6"/>

          <!-- turntable plinth -->
          <ellipse cx="150" cy="182" rx="95" ry="14" fill="#241a10"/>

          <!-- spinning disc -->
          <g class="vinyl-group">
            <circle cx="150" cy="150" r="78" fill="url(#discGrad)"/>
            <circle cx="150" cy="150" r="66" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
            <circle cx="150" cy="150" r="54" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
            <circle cx="150" cy="150" r="42" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
            <circle cx="150" cy="150" r="16" fill="#a9814c"/>
            <circle cx="150" cy="150" r="4" fill="#1a1206"/>
          </g>

          <!-- tonearm -->
          <g class="tonearm">
            <circle cx="238" cy="150" r="7" fill="#7a5b34"/>
            <rect x="150" y="147" width="88" height="5" rx="2.5" fill="#c9a262"/>
            <circle cx="150" cy="150" r="4" fill="#3a2a19"/>
          </g>
        </svg>
      </div>

      <div class="song-info">
        <p class="label">الأغنية التي تركتها لكِ</p>
        <p class="title" id="song-title"></p>
        <p class="artist" id="song-artist"></p>
        <button type="button" class="ink-btn" id="play-btn" style="border-color:var(--paper-shadow); color:var(--paper);">اسمعيها</button>
      </div>

      <div class="note" id="note">
        <p>يمكن بعض الكلام ما بيتقالش بسهولة...<br>فقلت أسيبه في أغنية.</p>
        <p class="wish">أتمنى تسمعيها وأنتِ مبسوطة.</p>
      </div>

      <div id="ending">
        <p id="ending-line"></p>
        <p class="sig" id="signature"></p>
      </div>
    </section>

  </main>

  <audio id="audio" src="Daq-El-Hawa-Ala-El-Bab.mp3" preload="none"></audio>

  <script>
    // ---- easily editable content ----
    const CONFIG = {
      songTitle: "دقّ الهوى ع الباب",
      artist: "فيروز",
      endingLine: "دلوقتي فهمتِ ليه كانت الأغنية جوّا الجواب.",
      signature: "— يوسف"
    };

    document.getElementById('song-title').textContent = CONFIG.songTitle;
    document.getElementById('song-artist').textContent = CONFIG.artist;
    document.getElementById('ending-line').textContent = CONFIG.endingLine;
    document.getElementById('signature').textContent = CONFIG.signature;

    // ---- dust particles ----
    const dustEl = document.getElementById('dust');
    for(let i=0;i<16;i++){
      const m = document.createElement('div');
      m.className = 'mote';
      m.style.left = Math.random()*100+'%';
      m.style.top = 40+Math.random()*50+'%';
      m.style.animationDuration = (8+Math.random()*10)+'s';
      m.style.animationDelay = (Math.random()*8)+'s';
      dustEl.appendChild(m);
    }

    // ---- letter opening ----
    const letter = document.getElementById('letter');
    const sceneLetter = document.getElementById('scene-letter');
    const sceneGramophone = document.getElementById('scene-gramophone');

    // ---- gramophone / audio ----
    const audio = document.getElementById('audio');
    const gramophone = document.getElementById('gramophone');
    const playBtn = document.getElementById('play-btn');
    const note = document.getElementById('note');
    const ending = document.getElementById('ending');

    const openBtn = document.getElementById('open-btn');

    function openGramophone(e){
      if(e) e.preventDefault();

      // Prevent double taps from firing the transition twice.
      if(openBtn.dataset.opened === 'true') return;
      openBtn.dataset.opened = 'true';
      openBtn.disabled = true;

      letter.classList.add('opening');
      sceneLetter.classList.add('leaving');

      // Opening the letter does NOT start the song.
      // The music starts only when "اسمعيها" is pressed.

      setTimeout(() => {
        sceneLetter.classList.remove('active','leaving');
        sceneGramophone.classList.add('active','entering');

        // Always start this scene in a stopped state.
        audio.pause();
        audio.currentTime = 0;
        gramophone.classList.remove('record-ready','spinning','active','ended');
        playBtn.textContent = 'اسمعيها';
        playBtn.style.opacity = '1';
        playBtn.style.pointerEvents = 'auto';

        requestAnimationFrame(() => {
          sceneGramophone.classList.remove('entering');
        });
      }, 900);
    }

    openBtn.addEventListener('click', openGramophone);
    openBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      openGramophone(e);
    }, {passive:false});

    playBtn.addEventListener('click', () => {
      if(audio.paused){
        audio.play().catch((error) => {
          console.error('تعذر تشغيل ملف الأغنية:', error);
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('error', () => {
      console.error('لم يتم العثور على ملف الأغنية أو تعذر تحميله. تأكد أن الملف موجود بجانب index.html وأن اسمه Daq-El-Hawa-Ala-El-Bab.mp3');
      playBtn.textContent = 'اسمعيها';
      playBtn.disabled = false;
    });

    audio.addEventListener('play', () => {
      gramophone.classList.remove('ended');
      gramophone.classList.add('record-ready','active','spinning');
      playBtn.textContent = 'وقفيها';
      playBtn.style.opacity = '1';
      playBtn.style.pointerEvents = 'auto';
      note.classList.add('shown');
    });

    audio.addEventListener('pause', () => {
      gramophone.classList.remove('spinning');
      if(!audio.ended){
        gramophone.classList.remove('record-ready','active');
        playBtn.textContent = 'اسمعيها';
      }
    });

    audio.addEventListener('ended', () => {
      gramophone.classList.remove('spinning','active','record-ready');
      gramophone.classList.add('ended');
      playBtn.textContent = 'اسمعيها';
      playBtn.style.opacity = '1';
      playBtn.style.pointerEvents = 'auto';
      setTimeout(() => ending.classList.add('shown'), 1200);
    });
  </script>
</body>
</html>
